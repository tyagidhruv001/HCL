# ── Server ─────────────────────────────────────────────────────────────────────
server.port=5000

# ── PostgreSQL ─────────────────────────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/learnai}
spring.datasource.username=${DB_USER:learnai}
spring.datasource.password=${DB_PASS:learnai_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── JWT ────────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:learnai-super-secret-jwt-signing-key-must-be-32-chars-minimum}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ── ML Service ─────────────────────────────────────────────────────────────────
ml.service.url=${ML_URL:http://localhost:8000}

# ── CORS ───────────────────────────────────────────────────────────────────────
cors.allowed-origins=${CORS_ORIGINS:http://localhost:8765,http://localhost:8766,http://localhost:5173}

# ── Gemini AI ──────────────────────────────────────────────────────────────────
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.0-flash}

# ── Logging ────────────────────────────────────────────────────────────────────
logging.level.com.learnai=INFO
logging.level.org.springframework.security=WARN

