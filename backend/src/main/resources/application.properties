server.port=${PORT:5050}

# ── Active Profile: defaults to 'h2' for instant zero-dependency local dev. ────
# Set SPRING_PROFILES_ACTIVE=postgres to use PostgreSQL container.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

# ── JPA / Hibernate ────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── JWT ────────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:learnai-super-secret-jwt-signing-key-must-be-32-chars-minimum}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ── ML Service ─────────────────────────────────────────────────────────────────
ml.service.url=${ML_URL:http://localhost:8088}

# ── CORS ───────────────────────────────────────────────────────────────────────
cors.allowed-origins=${CORS_ORIGINS:http://localhost:8765,http://localhost:8766,http://localhost:5173}

# ── Gemini AI ──────────────────────────────────────────────────────────────────
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.0-flash}

# ── Logging ────────────────────────────────────────────────────────────────────
logging.level.com.learnai=INFO
logging.level.org.springframework.security=WARN
