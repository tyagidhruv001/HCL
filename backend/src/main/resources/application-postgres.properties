# ── PostgreSQL Profile (For Docker / Production database) ───────────────────
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:6432/learnai}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:learnai}
spring.datasource.password=${DB_PASS:learnai_pass}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
